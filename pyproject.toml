[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmosdr"
version = "0.1.0"
description = "Utility for signal acquisitiona and processing from an RTL SDR device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.2",
    "pyrtlsdr>=0.3.0",
    "rtl-sdr>=1.0.0",
    "scipy>=1.16.2",
    "setuptools>=80.9.0",
    "structlog>=25.4.0",
]

[tool.setuptools.packages.find]
include = ["cosmosdr*"]
exclude = ["tests*", "build*"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "nbformat>=5.10.4",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]
ui = [
    "dash>=3.2.0",
]
